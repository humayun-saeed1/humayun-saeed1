<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="384" viewBox="0 0 1000 384" role="img" aria-label="GitHub activity">
<style>
  .label{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;letter-spacing:1.5px;fill:#8C959F}
  .note{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:11.5px;fill:#8C959F}
  .num{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:28px;font-weight:600;letter-spacing:-.5px;fill:#1F2328}
  .cap{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:13.5px;fill:#59636E}
  .lang{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;font-size:14px;fill:#1F2328}
  .pct{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#8C959F}
  .in{animation:in .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  .line{fill:none;stroke:#1F2328;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
         stroke-dasharray:1284;animation:draw 2.6s .4s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{from{stroke-dashoffset:1284}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s .6s cubic-bezier(.2,.7,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}}
  .ring{fill:none;stroke:#1A7F37;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
  @keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
</style>
