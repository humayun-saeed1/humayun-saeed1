<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="05 // CONTACT">
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080F"/><stop offset="1" stop-color="#0C0A1E"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity=".05"/></pattern>
  
</defs>
<style>
  .lbl{font-weight:600;font-size:13px;font-family:'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, monospace;letter-spacing:3px;fill:#8A93B5}
  .lbl b{fill:#A78BFA}
  .beam{stroke-dasharray:521 2371;animation:run 7s linear infinite}
  @keyframes run{to{stroke-dashoffset:-2892}}
  .up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}}
  @keyframes blink{50%{opacity:.15}}
  .btn{stroke-dasharray:290 678;animation:bt 3.5s linear infinite}
  @keyframes bt{to{stroke-dashoffset:-968}}
  .arr{animation:ar 1.4s ease-in-out infinite}
  @keyframes ar{50%{transform:translateX(6px)}}
</style>
<rect x="1" y="1" width="1198" height="248" rx="18" fill="url(#fbg)"/>
<rect x="1" y="1" width="1198" height="248" rx="18" fill="url(#dots)"/>
<rect x="1" y="1" width="1198" height="248" rx="18" fill="none" stroke="#1D2647" stroke-width="1.5"/>
<rect class="beam" x="1" y="1" width="1198" height="248" rx="18" fill="none" stroke="url(#beam)" stroke-width="2" stroke-linecap="round"/>
<text class="lbl" x="34" y="44"><tspan fill="#A78BFA">05</tspan> // CONTACT</text>
<circle cx="1160" cy="40" r="4" fill="#34D399" style="animation:blink 1.6s ease-in-out infinite"/>

