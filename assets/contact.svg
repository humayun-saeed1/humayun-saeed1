    <text x="34" y="208" style="font-weight:500;font-size:15px;font-family:'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#8A93B5">Freelance · AI integrations · Full-stack products · Architecture consulting</text>
