      <stop offset="0" stop-color="#C4B5FD"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#C4B5FD"/>
      <animate attributeName="x1" values="0;700" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="700;1400" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
