<style>
  .o1{animation:d1 14s ease-in-out infinite alternate}
  .o2{animation:d2 18s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(140px,40px)}}
  @keyframes d2{to{transform:translate(-160px,-30px)}}
  @keyframes tw{50%{opacity:.1}}
  .grid line,.grid path{stroke:#A78BFA;stroke-width:1;opacity:.55}
  .hl{animation:scroll 1.1s linear infinite}
