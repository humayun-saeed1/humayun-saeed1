  .name{font-weight:900;font-size:92px;font-family:'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:10px}
  .g1,.g2{opacity:0}
  .g1{animation:gl1 5s steps(1) infinite}
  .g2{animation:gl2 5s steps(1) infinite}
  @keyframes gl1{0%,88%,100%{opacity:0;transform:none}89%{opacity:.8;transform:translate(-6px,2px)}91%{opacity:.6;transform:translate(5px,-2px)}93%{opacity:0}}
  @keyframes gl2{0%,88%,100%{opacity:0;transform:none}90%{opacity:.8;transform:translate(6px,-1px)}92%{opacity:.5;transform:translate(-4px,2px)}94%{opacity:0}}
  .sub{font-weight:600;font-size:19px;font-family:'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, monospace;letter-spacing:9px;fill:#C7CEF0}
  .hud{font-weight:600;font-size:12px;font-family:'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, monospace;letter-spacing:3px;fill:#6B75A0}
  .scan{animation:scan 6s linear infinite}
  @keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(410px)}}
  .pulse{transform-origin:478px 266px;animation:pl 1.8s ease-out infinite}
  @keyframes pl{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
  .in1{animation:fin 1s .1s cubic-bezier(.2,.8,.2,1) both}
  .in2{animation:fin 1s .4s cubic-bezier(.2,.8,.2,1) both}
  .in3{animation:fin 1s .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fin{from{opacity:0;transform:translateY(18px)}}
  .caret{animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
</style>
